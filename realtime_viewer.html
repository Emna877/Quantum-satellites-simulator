<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Real-time CubeSat Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
      html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
      .overlay { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(0,0,0,0.4); color: #fff; padding: 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="overlay">Real-time CubeSat Viewer (WebSocket)</div>
    <div id="cesiumContainer"></div>
    <script>
      const viewer = new Cesium.Viewer('cesiumContainer', {
        shouldAnimate: true,
        timeline: true,
        animation: true
      });

      const czmlSource = new Cesium.CzmlDataSource();
      viewer.dataSources.add(czmlSource);

      // create a SampledPositionProperty entity for the satellite
      const entity = viewer.entities.add({
        id: 'CubeSat-1',
        name: 'CubeSat-1',
        position: new Cesium.SampledPositionProperty(),
        point: { pixelSize: 10, color: Cesium.Color.RED },
        label: { text: 'CubeSat-1', pixelOffset: new Cesium.Cartesian2(0, -20) },
        path: { leadTime: 0, trailTime: 3600, width: 2, material: Cesium.Color.RED }
      });

      viewer.trackedEntity = entity;

      // ground stations container
      const gsEntities = {};

      const ws = new WebSocket('ws://' + window.location.host + '/ws');
      ws.onopen = function() {
        console.log('WS open');
        // send a keep-alive ping every 20s
        setInterval(()=>{ try { ws.send('ping') } catch(e){} }, 20000);
      };
      ws.onmessage = function(evt) {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'stations') {
            for (let s of msg.stations) {
              const posCart = Cesium.Cartesian3.fromDegrees(s.lon_deg, s.lat_deg, s.alt_m);
              const gs = viewer.entities.add({
                id: s.name,
                name: s.name,
                position: Cesium.Cartesian3.fromDegrees(s.lon_deg, s.lat_deg, s.alt_m),
                point: { pixelSize: 8, color: Cesium.Color.BLUE },
                label: { text: s.name, font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
              });
              gsEntities[s.name] = gs;
            }
          } else if (msg.type === 'position') {
            const t = Cesium.JulianDate.fromIso8601(msg.time);
            const p = Cesium.Cartesian3.fromElements(msg.position[0], msg.position[1], msg.position[2]);
            entity.position.addSample(t, p, Cesium.ReferenceFrame.FIXED);
          }
        } catch (e) {
          console.error('WS message error', e, evt.data);
        }
      };
      ws.onclose = function() { console.log('WS closed'); };
      ws.onerror = function(e) { console.error('WS error', e); };
    </script>
  </body>
</html>
