<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CubeSat CZML Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
      html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script>
      const viewer = new Cesium.Viewer('cesiumContainer', {
        shouldAnimate: true,
        timeline: true,
        animation: true
      });
      // Load the CZML file (served from local filesystem in browser; Chrome may block local file fetch,
      // so best: run a lightweight static server, e.g. `python -m http.server` in project folder and open http://localhost:8000)
      Cesium.CzmlDataSource.load('./cubesat.czml').then(function(dataSource) {
        viewer.dataSources.add(dataSource);
        viewer.zoomTo(dataSource);
      }).otherwise(function(error){
        console.error(error);
        alert('Failed to load CZML. If you opened this file locally, run a simple local server (python -m http.server) and open http://localhost:8000');
      });
    </script>
  </body>
</html>
